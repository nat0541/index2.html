<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>令和・宝島アドベンチャー</title>

<style>
*{
    box-sizing:border-box;
}

:root{
    --gold:#ffd86b;
    --gold2:#ff9f1c;
    --navy:#03142b;
    --blue:#062b55;
    --cyan:#35d9ff;
    --white:#f6fbff;
    --danger:#ff4b64;
}

html,body{
    margin:0;
    min-height:100%;
    font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
    background:#010612;
    color:white;
}

body{
    overflow-x:hidden;
}

/* ================================
   背景
================================ */

#world{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-10;
    background:
        radial-gradient(circle at 50% 10%,rgba(30,103,180,.35),transparent 38%),
        linear-gradient(#021128 0%,#062a50 55%,#073c60 100%);
    transition:background 1.4s ease;
}

#skyGlow{
    position:absolute;
    inset:0;
    opacity:.75;
    pointer-events:none;
}

.cloud{
    position:absolute;
    width:180px;
    height:50px;
    border-radius:60px;
    background:rgba(255,255,255,.16);
    filter:blur(1px);
    animation:cloudMove linear infinite;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:inherit;
    border-radius:50%;
}

.cloud::before{
    width:70px;
    height:70px;
    left:28px;
    top:-30px;
}

.cloud::after{
    width:95px;
    height:80px;
    right:20px;
    top:-35px;
}

.c1{
    top:12%;
    left:-220px;
    animation-duration:32s;
}

.c2{
    top:24%;
    left:-340px;
    animation-duration:47s;
    transform:scale(.7);
}

@keyframes cloudMove{
    from{transform:translateX(0)}
    to{transform:translateX(calc(100vw + 600px))}
}

/* ================================
   海
================================ */

#sea{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:37%;
    overflow:hidden;
    background:
        linear-gradient(
            rgba(32,143,191,.6),
            rgba(2,45,82,.92)
        );
}

.wave{
    position:absolute;
    left:-10%;
    width:120%;
    height:70px;
    border-radius:50%;
    border-top:4px solid rgba(138,232,255,.35);
    animation:waveMove 3.5s ease-in-out infinite alternate;
}

.w1{top:18%}
.w2{top:40%;animation-delay:.8s}
.w3{top:65%;animation-delay:1.3s}

@keyframes waveMove{
    from{transform:translateX(-18px) translateY(0)}
    to{transform:translateX(18px) translateY(9px)}
}

/* ================================
   船
================================ */

#ship{
    position:absolute;
    bottom:23%;
    left:12%;
    width:180px;
    height:110px;
    transform-origin:center bottom;
    animation:shipFloat 3s ease-in-out infinite;
    transition:left 1.5s ease;
}

.shipHull{
    position:absolute;
    bottom:0;
    left:15px;
    width:150px;
    height:38px;
    background:linear-gradient(#8b5127,#3e210f);
    clip-path:polygon(0 0,100% 0,82% 100%,18% 100%);
    box-shadow:0 9px 25px rgba(0,0,0,.5);
}

.shipMast{
    position:absolute;
    width:6px;
    height:92px;
    background:#7a502d;
    left:88px;
    bottom:30px;
}

.sail{
    position:absolute;
    left:94px;
    bottom:53px;
    width:65px;
    height:58px;
    background:linear-gradient(135deg,#fff6cb,#c7b27c);
    clip-path:polygon(0 0,100% 50%,0 100%);
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));
}

.flag{
    position:absolute;
    width:35px;
    height:20px;
    background:#b61f35;
    left:93px;
    bottom:103px;
    clip-path:polygon(0 0,100% 25%,85% 100%,0 78%);
}

@keyframes shipFloat{
    0%,100%{transform:rotate(-2deg) translateY(0)}
    50%{transform:rotate(2deg) translateY(-9px)}
}

/* ================================
   カモメ
================================ */

#bird{
    position:absolute;
    top:20%;
    left:-100px;
    font-size:40px;
    opacity:0;
}

.flyBird{
    opacity:1!important;
    animation:birdFly 8s linear;
}

@keyframes birdFly{
    from{
        left:-100px;
        transform:translateY(0);
    }
    45%{
        transform:translateY(-70px);
    }
    to{
        left:110%;
        transform:translateY(20px);
    }
}

/* ================================
   雷
================================ */

#lightning{
    position:fixed;
    inset:0;
    z-index:60;
    pointer-events:none;
    background:white;
    opacity:0;
}

.flash{
    animation:flash .7s;
}

@keyframes flash{
    0%{opacity:0}
    10%{opacity:.95}
    20%{opacity:0}
    32%{opacity:.8}
    44%{opacity:0}
    100%{opacity:0}
}

/* ================================
   メイン
================================ */

#app{
    width:min(1050px,96%);
    margin:0 auto;
    padding:14px 0 50px;
}

.title{
    text-align:center;
    font-size:clamp(26px,5vw,52px);
    margin:14px 0 10px;
    color:var(--gold);
    text-shadow:
        0 0 6px #fff,
        0 0 16px #ffc53d,
        0 0 38px #ff8b00;
    letter-spacing:.08em;
}

.subtitle{
    text-align:center;
    opacity:.92;
    margin-bottom:18px;
}

/* ================================
   ステータス
================================ */

#statusBar{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    position:sticky;
    top:5px;
    z-index:20;
    margin-bottom:12px;
}

.status{
    padding:10px 5px;
    border-radius:13px;
    background:rgba(3,15,34,.88);
    border:1px solid rgba(255,216,107,.5);
    text-align:center;
    box-shadow:
        inset 0 0 16px rgba(53,217,255,.08),
        0 5px 20px rgba(0,0,0,.35);
    backdrop-filter:blur(8px);
}

.status small{
    display:block;
    color:#9edcf3;
    font-size:11px;
}

.status strong{
    display:block;
    margin-top:3px;
    color:#fff4c8;
    font-size:16px;
}

/* ================================
   物語カード
================================ */

#storyCard{
    margin-top:185px;
    padding:24px;
    min-height:370px;
    border-radius:24px;
    border:1px solid rgba(255,215,110,.45);
    background:
        linear-gradient(
            145deg,
            rgba(1,11,27,.94),
            rgba(5,28,57,.93)
        );
    box-shadow:
        0 18px 55px rgba(0,0,0,.6),
        inset 0 0 35px rgba(53,217,255,.06);
    backdrop-filter:blur(13px);
}

.sceneNo{
    color:#78dfff;
    font-size:14px;
    letter-spacing:.12em;
}

#sceneTitle{
    margin:7px 0 15px;
    font-size:clamp(25px,4vw,40px);
    color:var(--gold);
    text-shadow:0 0 14px rgba(255,190,45,.35);
}

#storyText{
    white-space:pre-line;
    line-height:2;
    font-size:clamp(17px,2vw,21px);
    color:#edf8ff;
    min-height:170px;
}

.fadeIn{
    animation:fadeScene .8s ease;
}

@keyframes fadeScene{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* ================================
   ボタン
================================ */

#choices{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    margin-top:22px;
}

button{
    font-family:inherit;
}

.choice,
.controlBtn,
.menuBtn{
    border:none;
    color:#08203b;
    font-weight:bold;
    cursor:pointer;
    border-radius:15px;
    padding:14px 14px;
    background:
        linear-gradient(#ffe889,#e3a927);
    box-shadow:
        0 7px 0 #8d6412,
        0 11px 22px rgba(0,0,0,.35);
    transition:.1s;
}

.choice:hover,
.controlBtn:hover,
.menuBtn:hover{
    filter:brightness(1.1);
}

.choice:active,
.controlBtn:active,
.menuBtn:active{
    transform:translateY(6px) scale(.98);
    box-shadow:
        0 1px 0 #8d6412,
        0 4px 10px rgba(0,0,0,.3);
}

/* ================================
   操作欄
================================ */

#controls{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:16px;
    justify-content:center;
}

.controlBtn{
    font-size:13px;
    padding:10px 12px;
    background:linear-gradient(#8be8ff,#2ebad9);
    box-shadow:
        0 5px 0 #146276,
        0 8px 16px rgba(0,0,0,.3);
}

input[type=range]{
    width:100px;
}

/* ================================
   スタート画面
================================ */

#startScreen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at 50% 22%,#0b4771 0,#031a35 38%,#010611 74%);
}

.startPanel{
    width:min(720px,95vw);
    padding:35px 24px;
    text-align:center;
    border:1px solid rgba(255,211,97,.55);
    border-radius:28px;
    background:rgba(1,10,24,.82);
    box-shadow:
        0 0 70px rgba(18,145,205,.22),
        inset 0 0 40px rgba(255,190,50,.05);
}

.startTitle{
    font-size:clamp(32px,7vw,65px);
    color:#ffd667;
    text-shadow:
        0 0 8px white,
        0 0 20px #ffbd1a,
        0 0 48px #ff7400;
}

.startSub{
    margin:16px 0 30px;
    font-size:clamp(16px,3vw,24px);
}

.menu{
    display:grid;
    gap:13px;
    width:min(420px,95%);
    margin:auto;
}

.menuBtn{
    font-size:18px;
}

/* ================================
   宝箱
================================ */

#treasureOverlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:90;
    justify-content:center;
    align-items:center;
    pointer-events:none;
    background:radial-gradient(circle,rgba(255,216,60,.18),rgba(0,0,0,.78));
}

.treasureBox{
    font-size:150px;
    animation:treasureGlow 1.3s infinite alternate;
}

@keyframes treasureGlow{
    from{
        transform:scale(.92);
        filter:drop-shadow(0 0 10px gold);
    }
    to{
        transform:scale(1.08);
        filter:drop-shadow(0 0 50px #fff06a);
    }
}

.goldParticle{
    position:fixed;
    top:-30px;
    z-index:95;
    pointer-events:none;
    font-size:28px;
    animation:coinFall 4s linear forwards;
}

@keyframes coinFall{
    to{
        top:110vh;
        transform:rotate(700deg);
    }
}

/* ================================
   THE END
================================ */

.theEnd{
    font-size:clamp(45px,10vw,110px);
    text-align:center;
    color:#ffe680;
    text-shadow:
        0 0 8px white,
        0 0 30px gold,
        0 0 80px #ff7300;
    animation:endPulse 1.5s infinite alternate;
}

@keyframes endPulse{
    to{
        letter-spacing:.15em;
        transform:scale(1.05);
    }
}

/* ================================
   スマホ
================================ */

@media(max-width:700px){

    #statusBar{
        grid-template-columns:repeat(3,1fr);
    }

    #storyCard{
        margin-top:155px;
        padding:18px;
    }

    #choices{
        grid-template-columns:1fr;
    }

    #ship{
        transform:scale(.75);
        left:4%;
    }

    .choice{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div id="world">
    <div id="skyGlow"></div>

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

    <div id="bird">🕊️</div>

    <div id="ship">
        <div class="shipHull"></div>
        <div class="shipMast"></div>
        <div class="sail"></div>
        <div class="flag"></div>
    </div>

    <div id="sea">
        <div class="wave w1"></div>
        <div class="wave w2"></div>
        <div class="wave w3"></div>
    </div>
</div>

<div id="lightning"></div>

<div id="treasureOverlay">
    <div class="treasureBox">🧰✨</div>
</div>

<div id="startScreen">
    <div class="startPanel">

        <div class="startTitle">
            令和・宝島<br>アドベンチャー
        </div>

        <div class="startSub">
            伝説の宝島を目指し、大海原へ――
        </div>

        <div class="menu">
            <button class="menuBtn" onclick="newGame()">
                ⚓ 冒険を始める
            </button>

            <button class="menuBtn" onclick="continueGame()">
                📖 続きから
            </button>

            <button class="menuBtn" onclick="toggleBGM()">
                🎵 音楽 ON / OFF
            </button>

            <button class="menuBtn" onclick="toggleSFX()">
                🔊 効果音 ON / OFF
            </button>

            <button class="menuBtn" onclick="toggleNarration()">
                🎙 ナレーション ON / OFF
            </button>
        </div>
    </div>
</div>

<div id="app">

    <h1 class="title">令和・宝島アドベンチャー</h1>

    <div class="subtitle">
        伝説の宝島を目指し、大海原へ――
    </div>

    <div id="statusBar">

        <div class="status">
            <small>❤️ 体力</small>
            <strong id="hp">100</strong>
        </div>

        <div class="status">
            <small>🍖 食料</small>
            <strong id="food">100</strong>
        </div>

        <div class="status">
            <small>🪙 金貨</small>
            <strong id="gold">20</strong>
        </div>

        <div class="status">
            <small>📍 現在地</small>
            <strong id="place">港町</strong>
        </div>

        <div class="status">
            <small>📅 航海日数</small>
            <strong id="day">0日</strong>
        </div>

    </div>

    <main id="storyCard">

        <div class="sceneNo" id="sceneNo">
            SCENE 01
        </div>

        <h2 id="sceneTitle">
            物語の始まり
        </h2>

        <div id="storyText"></div>

        <div id="choices"></div>

        <div id="controls">

            <button class="controlBtn" onclick="saveGame()">
                💾 セーブ
            </button>

            <button class="controlBtn" onclick="toggleBGM()">
                🎵 BGM
            </button>

            <button class="controlBtn" onclick="toggleSFX()">
                🔊 効果音
            </button>

            <button class="controlBtn" onclick="toggleNarration()">
                🎙 声
            </button>

            <button class="controlBtn" onclick="stopNarration()">
                ⏹ 読み上げ停止
            </button>

            <button class="controlBtn" onclick="restartGame()">
                🔄 最初から
            </button>

            <button class="controlBtn" onclick="deleteSave()">
                🗑 セーブ削除
            </button>

            <span style="font-size:13px">
                声の速さ
                <input
                    id="speechRate"
                    type="range"
                    min="0.6"
                    max="1.5"
                    step="0.1"
                    value="0.9"
                >
            </span>

            <span style="font-size:13px">
                音量
                <input
                    id="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    value="0.45"
                >
            </span>

        </div>

    </main>

</div>

<!-- BGM -->
<audio id="bgm" loop></audio>

<!-- 効果音 -->
<audio id="sfx"></audio>

<script>

/* =====================================================
   令和・宝島アドベンチャー
   GitHub Pages 完全版
===================================================== */

const SAVE_KEY = "reiwa_treasure_adventure_save_v1";

/* =====================================================
   音楽ファイル
===================================================== */

const bgmFiles = {

    port: "bgm_port.mp3",

    departure: "bgm_departure.mp3",

    sea: "bgm_sea.mp3",

    night: "bgm_night.mp3",

    storm: "bgm_storm.mp3",

    pirate: "bgm_pirate.mp3",

    island: "bgm_island.mp3",

    jungle: "bgm_jungle.mp3",

    cave: "bgm_cave.mp3",

    treasure: "bgm_treasure.mp3",

    ending: "bgm_ending.mp3"

};

const sfxFiles = {

    wave: "sfx_wave.mp3",

    seagull: "sfx_seagull.mp3",

    ship: "sfx_ship.mp3",

    wind: "sfx_wind.mp3",

    thunder: "sfx_thunder.mp3",

    bigwave: "sfx_bigwave.mp3",

    cannon: "sfx_cannon.mp3",

    sword: "sfx_sword.mp3",

    jungle: "sfx_jungle.mp3",

    footsteps: "sfx_footsteps.mp3",

    cave: "sfx_cave.mp3",

    bat: "sfx_bat.mp3",

    stone: "sfx_stone.mp3",

    chest: "sfx_chest.mp3",

    coin: "sfx_coin.mp3",

    fanfare: "sfx_fanfare.mp3"

};

/* =====================================================
   状態
===================================================== */

let state = {

    scene:0,

    hp:100,

    food:100,

    gold:20,

    place:"港町",

    day:0,

    bgmOn:true,

    sfxOn:true,

    narrationOn:true,

    flags:{}

};

let currentBGM = "";

/* =====================================================
   物語
===================================================== */

const scenes = [

/* 0 */
{
title:"古い港町",
place:"港町",
day:0,
bgm:"port",

text:`
海に面した小さな港町。

潮の香りと、カモメの声。
遠くでは古い帆船のマストが風に揺れている。

あなたは、幼いころから海の向こうにあるという
「黄金の島」の伝説を聞いて育った。

しかし、その島を本当に見た者はいない。

ある朝。

港の古道具屋で、
あなたは埃をかぶった木箱を見つけた。

店主が言った。

「そいつは何十年も誰も開けていない箱だ。」

箱の中には――
古びた羊皮紙が入っていた。
`,

choices:[
{
text:"🗺 羊皮紙を広げる",
next:1
},
{
text:"👴 店主に箱の由来を聞く",
next:2
}
]
},

/* 1 */
{
title:"宝の地図",
place:"港町",
bgm:"port",

text:`
羊皮紙には、海と島々が描かれていた。

中央には巨大な赤い印。

そして震えるような文字で、

「月が海に沈む夜、
三つの星が指す先に黄金の島あり」

と記されていた。

地図の隅には、
奇妙な髑髏の印もある。

これは単なる古地図ではない。

あなたの胸が高鳴った。

もしかすると――

伝説の宝島は、本当に存在する。
`,

choices:[
{
text:"🍺 港の酒場へ行く",
next:3
},
{
text:"🔍 地図をもっと調べる",
next:2,
gold:5
}
]
},

/* 2 */
{
title:"失われた船長の日記",
place:"古道具屋",
bgm:"port",

text:`
木箱の底板を調べると、
小さな隠し扉が見つかった。

中から出てきたのは、
革張りの日記帳だった。

最後のページにはこうある。

「黄金の島は富を求める者には見えぬ。
仲間を信じる者だけが、
最後の門を開くことができる。」

そして署名。

――船長アルバート・レイ。

五十年前に消息を絶った、
伝説の冒険家だった。
`,

choices:[
{
text:"📖 日記を持って酒場へ",
next:3,
gold:5
}
]
},

/* 3 */
{
title:"海鳴り亭",
place:"港の酒場",
bgm:"port",

text:`
港で最も古い酒場「海鳴り亭」。

船乗りたちが酒を飲み、
航海の武勇伝を語っている。

あなたが宝の地図を広げると、
酒場が急に静まり返った。

白いひげの老人が席を立つ。

「その印……。」

老人は地図を見つめた。

「わしは若いころ、
その島の近くまで行ったことがある。」

周囲の船乗りがざわめいた。
`,

choices:[
{
text:"👴 老人の話を聞く",
next:4
},
{
text:"💰 金貨5枚で情報を買う",
next:4,
gold:-5
}
]
},

/* 4 */
{
title:"老人の警告",
place:"港の酒場",
bgm:"port",

text:`
老人は低い声で語った。

「宝島へ向かった船は何隻もある。」

「だが帰ってきた船は、ほとんどない。」

霧。
嵐。
海賊。
巨大な海の怪物。

そして――

島そのものが、
人間を試すのだという。

老人は最後に言った。

「それでも行くのか？」

あなたは地図を握りしめた。
`,

choices:[
{
text:"⚓ 行く。船を探す",
next:5
},
{
text:"🔥 もちろん行く！",
next:5,
hp:5
}
]
},

/* 5 */
{
title:"古い帆船",
place:"港",
bgm:"departure",

text:`
港の端に、
一隻の古い帆船が停泊していた。

船の名は――

/* =====================================================
   初期化
===================================================== */

const bgmEl = document.getElementById("bgm");
const sfxEl = document.getElementById("sfx");

const volumeSlider = document.getElementById("volume");

volumeSlider.addEventListener("input",()=>{

    bgmEl.volume = Number(volumeSlider.value);

    sfxEl.volume = Math.min(
        1,
        Number(volumeSlider.value) + .15
    );

});

/* =====================================================
   新しいゲーム
===================================================== */

function newGame(){

    state = {

        scene:0,

        hp:100,

        food:100,

        gold:20,

        place:"港町",

        day:0,

        bgmOn:true,

        sfxOn:true,

        narrationOn:true,

        flags:{}

    };

    document.getElementById("startScreen").style.display="none";

    showScene(0);

}

/* =====================================================
   続きから
===================================================== */

function continueGame(){

    const data = localStorage.getItem(SAVE_KEY);

    if(!data){

        alert("まだセーブデータがありません。");

        return;

    }

    try{

        const loaded = JSON.parse(data);

        state = Object.assign(state,loaded);

        document.getElementById("startScreen").style.display="none";

        showScene(state.scene,false);

    }catch(e){

        alert("セーブデータを読み込めませんでした。");

    }

}

/* =====================================================
   場面表示
===================================================== */

function showScene(index,autoSave=true){

    if(index < 0) index = 0;

    if(index >= scenes.length){
        index = scenes.length - 1;
    }

    state.scene = index;

    const scene = scenes[index];

    if(scene.place){
        state.place = scene.place;
    }

    if(typeof scene.day === "number"){
        state.day = Math.max(
            state.day,
            scene.day
        );
    }

    state.hp = Math.max(1,Math.min(100,state.hp));

    state.food = Math.max(0,Math.min(150,state.food));

    updateStatus();

    const card =
        document.getElementById("storyCard");

    card.classList.remove("fadeIn");

    void card.offsetWidth;

    card.classList.add("fadeIn");

    document.getElementById("sceneNo").textContent =
        "SCENE " +
        String(index + 1).padStart(2,"0");

    document.getElementById("sceneTitle").textContent =
        scene.title;

    document.getElementById("storyText").textContent =
        scene.text.trim();

    renderChoices(scene);

    setBGM(scene.bgm);

    applyAtmosphere(scene);

    if(
        index === 9 ||
        index === 11
    ){
        flyBird();
    }

    if(
        index === 17 ||
        index === 18 ||
        index === 19
    ){
        lightning();
    }

    if(
        index === 48 ||
        index === 54
    ){
        treasureEffect();
    }

    if(scene.ending){

        document.getElementById("storyText").innerHTML =
            `
            <div style="white-space:pre-line">
            ${escapeHTML(scene.text.trim())}
            </div>

            <div class="theEnd">
                THE END
            </div>
            `;

        const btn =
            document.createElement("button");

        btn.className="choice";

        btn.textContent="🌊 もう一度冒険する";

        btn.onclick=restartGame;

        document.getElementById("choices").appendChild(btn);

        treasureRain();

        playSFX("fanfare");

    }

    if(state.narrationOn){

        setTimeout(
            ()=>speakScene(scene),
            450
        );

    }

    if(autoSave){

        saveGame(true);

    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

/* =====================================================
   選択肢
===================================================== */

function renderChoices(scene){

    const area =
        document.getElementById("choices");

    area.innerHTML="";

    scene.choices.forEach(choice=>{

        const btn =
            document.createElement("button");

        btn.className="choice";

        btn.textContent=choice.text;

        btn.onclick=()=>choose(choice);

        area.appendChild(btn);

    });

}

/* =====================================================
   選択処理
===================================================== */

function choose(choice){

    if(choice.hp){

        state.hp += choice.hp;

    }

    if(choice.food){

        state.food += choice.food;

    }

    if(choice.gold){

        state.gold += choice.gold;

    }

    if(choice.day){

        state.day += choice.day;

    }

    if(choice.flag){

        state.flags[choice.flag]=true;

    }

    if(choice.sfx){

        playSFX(choice.sfx);

    }

    state.hp =
        Math.max(1,Math.min(100,state.hp));

    state.food =
        Math.max(0,Math.min(150,state.food));

    state.gold =
        Math.max(0,state.gold);

    showScene(choice.next);

}

/* =====================================================
   ステータス
===================================================== */

function updateStatus(){

    document.getElementById("hp").textContent =
        state.hp;

    document.getElementById("food").textContent =
        state.food;

    document.getElementById("gold").textContent =
        state.gold;

    document.getElementById("place").textContent =
        state.place;

    document.getElementById("day").textContent =
        state.day + "日";

}

/* =====================================================
   セーブ
===================================================== */

function saveGame(silent=false){

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(state)
    );

    if(!silent){

        alert("冒険の記録をセーブしました。");

    }

}

/* =====================================================
   セーブ削除
===================================================== */

function deleteSave(){

    const yes =
        confirm(
            "セーブデータを削除しますか？"
        );

    if(!yes) return;

    localStorage.removeItem(SAVE_KEY);

    alert(
        "セーブデータを削除しました。"
    );

}

/* =====================================================
   最初から
===================================================== */

function restartGame(){

    stopNarration();

    currentBGM="";

    bgmEl.pause();

    localStorage.removeItem(SAVE_KEY);

    document.getElementById(
        "treasureOverlay"
    ).style.display="none";

    document.getElementById(
        "startScreen"
    ).style.display="flex";

}

/* =====================================================
   BGM
===================================================== */

function setBGM(name){

    if(!name){
        return;
    }

    if(currentBGM === name){
        return;
    }

    currentBGM = name;

    bgmEl.pause();

    bgmEl.src =
        bgmFiles[name] || "";

    bgmEl.volume =
        Number(volumeSlider.value);

    if(!state.bgmOn){
        return;
    }

    if(!bgmEl.src){
        return;
    }

    bgmEl.play().catch(()=>{

        /*
        ブラウザの自動再生制限や、
        音源ファイル未設置でも
        ゲームを止めない。
        */

    });

}

/* =====================================================
   BGM ON/OFF
===================================================== */

function toggleBGM(){

    state.bgmOn = !state.bgmOn;

    if(state.bgmOn){

        if(currentBGM){

            bgmEl.src =
                bgmFiles[currentBGM];

            bgmEl.volume =
                Number(volumeSlider.value);

            bgmEl.play().catch(()=>{});

        }

        alert("BGMをONにしました。");

    }else{

        bgmEl.pause();

        alert("BGMをOFFにしました。");

    }

}

/* =====================================================
   効果音
===================================================== */

function playSFX(name){

    if(!state.sfxOn){
        return;
    }

    const file =
        sfxFiles[name];

    if(!file){
        return;
    }

    try{

        sfxEl.pause();

        sfxEl.currentTime=0;

        sfxEl.src=file;

        sfxEl.volume =
            Math.min(
                1,
                Number(volumeSlider.value)+.15
            );

        sfxEl.play().catch(()=>{});

    }catch(e){}

}

function toggleSFX(){

    state.sfxOn =
        !state.sfxOn;

    sfxEl.pause();

    alert(
        state.sfxOn
        ? "効果音をONにしました。"
        : "効果音をOFFにしました。"
    );

}

/* =====================================================
   音声読み上げ
===================================================== */

function toggleNarration(){

    state.narrationOn =
        !state.narrationOn;

    if(!state.narrationOn){

        stopNarration();

    }else{

        const scene =
            scenes[state.scene];

        if(scene){
            speakScene(scene);
        }

    }

    alert(
        state.narrationOn
        ? "ナレーションをONにしました。"
        : "ナレーションをOFFにしました。"
    );

}

/* =====================================================
   ナレーション
===================================================== */

function speakScene(scene){

    if(!state.narrationOn){
        return;
    }

    if(
        !("speechSynthesis" in window)
    ){
        return;
    }

    window.speechSynthesis.cancel();

    const text =
        scene.title + "。" +
        scene.text.replace(/\n/g," ");

    const utter =
        new SpeechSynthesisUtterance(text);

    utter.lang="ja-JP";

    utter.rate =
        Number(
            document.getElementById(
                "speechRate"
            ).value
        );

    utter.pitch=1;

    utter.volume=.95;

    const voices =
        window.speechSynthesis.getVoices();

    const japanese =
        voices.find(v=>
            v.lang &&
            v.lang.toLowerCase().startsWith("ja")
        );

    if(japanese){

        utter.voice=japanese;

    }

    window.speechSynthesis.speak(utter);

}

/* =====================================================
   読み上げ停止
===================================================== */

function stopNarration(){

    if(
        "speechSynthesis" in window
    ){

        window.speechSynthesis.cancel();

    }

}

/* =====================================================
   雰囲気
===================================================== */

function applyAtmosphere(scene){

    const world =
        document.getElementById("world");

    const title =
        scene.title;

    if(
        title.includes("夜") ||
        title.includes("星") ||
        title.includes("霧")
    ){

        world.style.background =
        `
        radial-gradient(
            circle at 60% 13%,
            rgba(81,102,170,.32),
            transparent 30%
        ),
        linear-gradient(
            #010513,
            #06162e 55%,
            #052c48
        )
        `;

    }

    else if(
        title.includes("嵐") ||
        title.includes("雷") ||
        title.includes("大波")
    ){

        world.style.background =
        `
        linear-gradient(
            #050811,
            #172437 50%,
            #05263b
        )
        `;

    }

    else if(
        title.includes("洞") ||
        title.includes("回廊") ||
        title.includes("宝殿")
    ){

        world.style.background =
        `
        radial-gradient(
            circle at 50% 20%,
            #2a2416,
            #05070b 60%,
            #010204
        )
        `;

    }

    else if(
        title.includes("宝") ||
        title.includes("黄金")
    ){

        world.style.background =
        `
        radial-gradient(
            circle at 50% 20%,
            rgba(190,136,22,.35),
            transparent 36%
        ),
        linear-gradient(
            #071124,
            #082f49,
            #073751
        )
        `;

    }

    else{

        world.style.background =
        `
        radial-gradient(
            circle at 50% 10%,
            rgba(30,103,180,.35),
            transparent 38%
        ),
        linear-gradient(
            #021128 0%,
            #062a50 55%,
            #073c60 100%
        )
        `;

    }

}

/* =====================================================
   カモメ
===================================================== */

function flyBird(){

    const bird =
        document.getElementById("bird");

    bird.classList.remove("flyBird");

    void bird.offsetWidth;

    bird.classList.add("flyBird");

    playSFX("seagull");

}

/* =====================================================
   雷
===================================================== */

function lightning(){

    const el =
        document.getElementById("lightning");

    el.classList.remove("flash");

    void el.offsetWidth;

    el.classList.add("flash");

    playSFX("thunder");

}

/* =====================================================
   宝箱演出
===================================================== */

function treasureEffect(){

    const el =
        document.getElementById(
            "treasureOverlay"
        );

    el.style.display="flex";

    treasureRain();

    setTimeout(()=>{

        el.style.display="none";

    },2500);

}

/* =====================================================
   金貨
===================================================== */

function treasureRain(){

    const icons =
        ["🪙","💎","✨","👑"];

    for(
        let i=0;
        i<30;
        i++
    ){

        const coin =
            document.createElement("div");

        coin.className=
            "goldParticle";

        coin.textContent =
            icons[
                Math.floor(
                    Math.random()*icons.length
                )
            ];

        coin.style.left =
            Math.random()*100 + "vw";

        coin.style.animationDelay =
            Math.random()*2 + "s";

        coin.style.animationDuration =
            (3 + Math.random()*3) + "s";

        document.body.appendChild(coin);

        setTimeout(()=>{

            coin.remove();

        },7000);

    }

}

/* =====================================================
   HTML安全化
===================================================== */

function escapeHTML(str){

    return str
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

/* =====================================================
   音声一覧取得
===================================================== */

if(
    "speechSynthesis" in window
){

    window.speechSynthesis.getVoices();

    window.speechSynthesis.onvoiceschanged =
        ()=>window.speechSynthesis.getVoices();

}
